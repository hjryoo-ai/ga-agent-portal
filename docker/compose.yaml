# =============================================================================================
# 데모 실행(포털 Phase 8 지시문 ②~④·C5, 설계서 §3.2 v1.11) — `docker compose -f docker/compose.yaml --profile demo up --build`
#   서비스는 전부 프로파일 `demo`다(엔진 + Oracle을 띄우는 `engine` 프로파일은 v2 — 계획 Q6, 지금은 e2e/engine-feed/run.sh).
#   화면 http://localhost:8080 · 로그인(Keycloak) http://localhost:8180 · 트레이스(Jaeger) http://localhost:16686 — 셋 다 127.0.0.1에만 묶는다.
#   관리 포트(9090 — /actuator/prometheus·헬스)는 compose 네트워크 안에서만(호스트 공개 0, 계획 Q5). DB도 공개하지 않는다.
# 데모 전용 제품 코드는 없다: 포털 이미지는 운영 설정 그대로이고 여기의 값(환경·인자·등록 SQL)만 다르다.
# 비밀은 저장소·.env·이미지·환경 변수에 0 — `secrets` 서비스가 처음 뜰 때 볼륨 `secrets`에 파일(0600, 소비자 uid 소유)로 만든다.
# 헬스 검사는 bash 내장만(/dev/tcp·read — 이미지에 curl·grep이 없을 수 있다, JRE 이미지의 /bin/sh는 dash라 bash를 직접 부른다). 준비 = 상태 줄 200.
# 이미지는 전부 digest 고정(태그는 사람이 읽는 주석). 판은 2026-10-28 레지스트리에서 확인한 최신 안정판, PostgreSQL은 시험 하네스와 같은 digest.
# =============================================================================================
name: ga-portal-demo

x-postgres-image: &postgres-image postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336  # 18.6 (libs.versions.toml postgres-image)

services:
  secrets:
    profiles: [demo]
    image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e  # 1.38.0
    command: ["sh", "/portal/generate.sh"]
    environment:
      DEMO_ENGINE_TOKEN: ${DEMO_ENGINE_TOKEN}
    volumes:
      - secrets:/run/secrets/all
      - ./secrets/generate.sh:/portal/generate.sh:ro
    restart: "no"

  postgres:
    profiles: [demo]
    image: *postgres-image
    depends_on:
      secrets: { condition: service_completed_successfully }
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/all/postgres/superuser
    volumes:
      - secrets:/run/secrets/all:ro
      - pgdata:/var/lib/postgresql
      - ./postgres/init-roles.sql:/portal/init-roles.sql:ro
      - ./postgres/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "portal"]
      interval: 2s
      timeout: 2s
      retries: 60

  keycloak:
    profiles: [demo]
    image: quay.io/keycloak/keycloak@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b  # 26.8.1
    depends_on:
      secrets: { condition: service_completed_successfully }
    # 관리자 비밀번호는 파일에서 프로세스 환경으로만(compose 설정·inspect에 0). 데모 렐름은 렐름 파일에서 가져온다(사용자 비밀번호는 해시만).
    entrypoint: ["/bin/bash", "-c", "KC_BOOTSTRAP_ADMIN_PASSWORD=\"$$(< /run/secrets/all/keycloak/admin)\" exec /opt/keycloak/bin/kc.sh start-dev --import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # 발급자 = 브라우저와 포털 컨테이너가 같은 문자열(계획 P-14): http://localhost:8180/realms/demo
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - secrets:/run/secrets/all:ro
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 3s
      timeout: 3s
      retries: 100

  demo:
    profiles: [demo]
    build: { context: .., dockerfile: docker/portal.Dockerfile, target: demo }
    image: ga-portal-demo/demo:local
    depends_on:
      secrets: { condition: service_completed_successfully }
    command: ["--data=/demo/data", "--tenant=DEMO", "--token-file=/run/secrets/all/demo/token", "--port=8090", "--replay=instant"]
    volumes:
      - secrets:/run/secrets/all:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 2s
      timeout: 2s
      retries: 60

  jaeger:
    profiles: [demo]
    image: jaegertracing/jaeger@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17  # 2.22.0 (OTLP 4318 수신, 메모리 저장)
    ports:
      - "127.0.0.1:16686:16686"

  portal:
    profiles: [demo]
    build: { context: .., dockerfile: docker/portal.Dockerfile, target: portal }
    image: ga-portal-demo/portal:local
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      demo: { condition: service_healthy }
      jaeger: { condition: service_started }
    # 서버 프로세스만의 설정은 인자로(환경 변수는 `docker compose exec portal … --spring.profiles.active=cli`에도 실린다 — CLI는 폴링하지 않는다)
    command: ["--portal.ingest.enabled=true", "--portal.ingest.limit=1000"]
    environment:
      PORTAL_DB_URL: jdbc:postgresql://postgres:5432/portal
      # DB 롤 비밀번호: application.yaml 자리표시자(PORTAL_*_PASSWORD)와 같은 이름의 파일(Spring configtree)
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/all/portal/config/
      PORTAL_ENGINE_TOKEN_DIR: /run/secrets/all/portal/engine-tokens
      PORTAL_POLICY_KEY_SECRET_FILE: /run/secrets/all/portal/policy-key
      MANAGEMENT_SERVER_PORT: "9090"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - secrets:/run/secrets/all:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 3s
      timeout: 3s
      retries: 100

  # 포털 컨테이너 안의 localhost:8180 → keycloak:8080(계획 P-14): 브라우저가 쓰는 발급자 주소를 포털도 그대로 쓴다(디스커버리·JWKS)
  idp-relay:
    profiles: [demo]
    image: alpine/socat@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287  # 1.8.1.3
    network_mode: "service:portal"
    depends_on:
      portal: { condition: service_started }
      keycloak: { condition: service_healthy }
    command: ["TCP-LISTEN:8180,fork,reuseaddr,bind=127.0.0.1", "TCP:keycloak:8080"]

  # 데모 테넌트·설계사 30명·운영자 등록(docs/운영.md §1~§3의 SQL) — 포털이 뜬 뒤(Flyway 끝) 한 번
  seed:
    profiles: [demo]
    image: *postgres-image
    user: "999:999"
    depends_on:
      portal: { condition: service_healthy }
    environment:
      PGPASSFILE: /run/secrets/all/postgres/pgpass
    command: ["psql", "-h", "postgres", "-U", "portal_migrator", "-d", "portal", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/portal/seed-demo.sql"]
    volumes:
      - secrets:/run/secrets/all:ro
      - ./postgres/seed-demo.sql:/portal/seed-demo.sql:ro
    restart: "no"

volumes:
  secrets:
  pgdata:
