name: ci

on:
  push:
    branches: [main]
    tags: ['phase-*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # ubuntu 러너에는 Docker가 있다. 통합 테스트(Testcontainers)는 Docker가 없으면 실패한다(스킵 금지).
    runs-on: ubuntu-latest
    env:
      CI: 'true'   # settings.gradle.kts: 플랫폼은 GitHub Packages에서만(mavenLocal 금지). SeededCases는 CI에서 시드 덮어쓰기를 무시한다
      # 플랫폼 0.2.0(GitHub Packages Maven 레지스트리, 발행 저장소 ga-disclosure) 읽기 — Maven 레지스트리는 저장소 스코프라 이 저장소의
      # GITHUB_TOKEN으로는 읽지 못한다. PAT(classic, read:packages)를 저장소 비밀로 받는다(계획 승인 §3). 비면 설정 단계에서 바로 실패한다.
      GHP_USER: ${{ secrets.GHP_USER }}
      GHP_READ_TOKEN: ${{ secrets.GHP_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Docker available
        run: docker info --format '{{.ServerVersion}}'

      - name: C9 — platform 0.2.0 resolved from GitHub Packages (paths and SHA-256 vs the handoff §6 table)
        run: ./gradlew printPlatformArtifacts --console=plain

      - name: net.jqwik must not appear in any dependency graph (CLAUDE.md 절대 규칙 7)
        run: |
          ./gradlew allDependencies --console=plain > deps.txt
          if grep -q 'net\.jqwik' deps.txt; then echo 'net.jqwik found'; exit 1; fi

      - name: Build (unit + archTest + integrationTest + build checks)
        run: ./gradlew build --console=plain

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
