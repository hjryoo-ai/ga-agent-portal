name: ci

on:
  push:
    branches: [main]
    tags: ['phase-*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # ubuntu 러너에는 Docker가 있다. 통합 테스트(Testcontainers)는 Docker가 없으면 실패한다(스킵 금지).
    runs-on: ubuntu-latest
    env:
      CI: 'true'   # settings.gradle.kts: 플랫폼은 GitHub Packages에서만(mavenLocal 금지). SeededCases는 CI에서 시드 덮어쓰기를 무시한다
      # 플랫폼 0.2.0(GitHub Packages Maven 레지스트리, 발행 저장소 ga-disclosure) 읽기 — Maven 레지스트리는 저장소 스코프라 이 저장소의
      # GITHUB_TOKEN으로는 읽지 못한다. PAT(classic, read:packages)를 저장소 비밀로 받는다(계획 승인 §3). 비면 설정 단계에서 바로 실패한다.
      GHP_USER: ${{ secrets.GHP_USER }}
      GHP_READ_TOKEN: ${{ secrets.GHP_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Docker available
        run: docker info --format '{{.ServerVersion}}'

      - name: C9 — platform 0.2.0 resolved from GitHub Packages (paths and SHA-256 vs the handoff §6 table)
        run: ./gradlew printPlatformArtifacts --console=plain

      - name: net.jqwik must not appear in any dependency graph (CLAUDE.md 절대 규칙 7)
        run: |
          ./gradlew allDependencies --console=plain > deps.txt
          if grep -q 'net\.jqwik' deps.txt; then echo 'net.jqwik found'; exit 1; fi

      - name: Build (unit + archTest + integrationTest + build checks)
        run: ./gradlew build --console=plain

      - name: C7 — shared contract copy equals ga-disclosure at the UPSTREAM merge commit (network)
        run: ./gradlew verifyUpstreamContract --console=plain

      # 포털 Phase 4 지시문 ①·C12: 화면 의존성 취약점 기록(결과로 실패하지 않는다 — 올림 없음). build/web/audit.json을 아티팩트로.
      - name: Web — pnpm audit record
        run: ./gradlew :web:webAudit --console=plain

      # 아티팩트는 GitHub의 비밀 가림을 거치지 않는다 — 올리기 전에 토큰 값이 없음을 센다(Phase 0 수용 심사 B2). 있으면 올리지 않는다.
      - name: Token absent from the report artifact
        id: token-check
        if: always()
        shell: bash
        run: |
          test -n "$GHP_READ_TOKEN" || { echo 'GHP_READ_TOKEN is empty'; exit 1; }
          hits=$( { find . -type f \( -path '*/build/test-results/*.xml' -o -path '*/build/reports/tests/*' -o -path './web/build/reports/vitest/*' \
                    -o -path './web/build/web/*.json' \) -print0 \
                    | xargs -0 -r grep -l -F -- "$GHP_READ_TOKEN" || true; } | wc -l)
          echo "files containing the token: $hits"
          test "$hits" -eq 0

      - name: Test reports
        if: always() && steps.token-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            web/build/reports/vitest/junit.xml
            web/build/web/bundle-size.json
            web/build/web/bundle-modules.json
            web/build/web/audit.json

  no-docker:
    # CLAUDE.md: Docker가 없으면 통합 테스트는 스킵이 아니라 실패해야 한다. 이 잡은 "실패해야 성공"이다(지시문 v1.2 §7·C8).
    # 컨테이너 잡(container:)은 쓰지 않는다 — GitHub Actions는 컨테이너 잡에 호스트의 /var/run/docker.sock을 마운트하므로 Docker가 사라지지 않는다
    # (ga-disclosure Phase 1에서 확인). 호스트 러너에서 Docker 데몬을 멈추고 소켓을 지운다.
    # 성공 조건: Gradle 종료 코드 ≠ 0, Testcontainers의 Docker 미발견 오류, 스킵 0건, 실패한 스위트 ≥ 1.
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      GHP_USER: ${{ secrets.GHP_USER }}
      GHP_READ_TOKEN: ${{ secrets.GHP_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Stop Docker and remove its socket
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo rm -f /var/run/docker.sock
          if docker info > /dev/null 2>&1; then echo 'Docker is still reachable'; exit 1; fi
          test ! -S /var/run/docker.sock
          echo 'Docker is unavailable'

      - name: portal-infra integrationTest must FAIL without Docker
        shell: bash
        run: |
          set +e
          ./gradlew :portal-infra:integrationTest --no-daemon --console=plain > it.log 2>&1
          code=$?
          set -e
          echo "gradle exit code: $code"
          tail -n 80 it.log
          if [ "$code" -eq 0 ]; then echo 'FAIL: integrationTest passed without Docker'; exit 1; fi
          if ! grep -q 'Could not find a valid Docker environment' it.log; then echo 'FAIL: no Testcontainers Docker-missing error in the log'; exit 1; fi
          results=$(ls portal-infra/build/test-results/integrationTest/*.xml 2>/dev/null | wc -l)
          if [ "$results" -eq 0 ]; then echo 'FAIL: no test results — the tests did not run'; exit 1; fi
          if grep -h -o 'skipped="[0-9]*"' portal-infra/build/test-results/integrationTest/*.xml | grep -v -q 'skipped="0"'; then
            echo 'FAIL: some integration tests were skipped'; exit 1
          fi
          failed=$(grep -l -E '(failures|errors)="[1-9]' portal-infra/build/test-results/integrationTest/*.xml | wc -l)
          echo "result files: $results, with failures/errors: $failed, skipped: 0"
          if [ "$failed" -eq 0 ]; then echo 'FAIL: no failing test suite'; exit 1; fi
          echo 'OK: integration tests failed (not skipped) because Docker is missing'

      # 아티팩트는 GitHub의 비밀 가림을 거치지 않는다 — 올리기 전에 토큰 값이 없음을 센다(Phase 0 수용 심사 B2). 있으면 올리지 않는다.
      - name: Token absent from the log artifact
        id: token-check
        if: always()
        shell: bash
        run: |
          test -n "$GHP_READ_TOKEN" || { echo 'GHP_READ_TOKEN is empty'; exit 1; }
          hits=$(cat it.log portal-infra/build/test-results/integrationTest/*.xml 2>/dev/null | grep -c -F -- "$GHP_READ_TOKEN" || true)
          echo "token occurrences: $hits"
          test "$hits" -eq 0

      - name: Logs
        if: always() && steps.token-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: no-docker-log
          path: |
            it.log
            portal-infra/build/test-results/integrationTest/*.xml
