spring:
  application:
    name: ga-agent-portal
  # 애플리케이션 데이터소스: portal_app (NOBYPASSRLS, DML만). 테넌트는 트랜잭션마다 TenantSessionBinder가 설정한다.
  # 기본값은 로컬 개발 전용 자격 증명(docker/postgres/init-roles.sql과 짝) — 운영은 환경으로 준다.
  datasource:
    url: ${PORTAL_DB_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${PORTAL_APP_USER:portal_app}
    password: ${PORTAL_APP_PASSWORD:app_local_only}
  # 마이그레이션: portal_migrator (스키마 소유자). 애플리케이션 데이터소스와 분리된 접속.
  # 조회 API 응답(포털 Phase 3): 비어 있는 선택 필드(Optional.empty)는 응답에서 뺀다 — 계약 portal-api.openapi.yaml의 선택 필드
  jackson:
    default-property-inclusion: non_absent
  # 스케줄러 스레드 둘(포털 Phase 7 P7-5): 인제스트 틱과 대사 틱이 서로를 기다리지 않게 — 기본 하나면 대사 회차(최대 recon max-seconds + 재구축)
  # 동안 모든 테넌트의 폴링이 멈춘다. 같은 틱은 fixedDelay라 자기와 겹치지 않는다. 연결 수는 docs/운영.md §8.
  task:
    scheduling:
      pool:
        size: 2
  flyway:
    url: ${PORTAL_DB_URL:jdbc:postgresql://localhost:5432/portal}
    user: ${PORTAL_MIGRATOR_USER:portal_migrator}
    password: ${PORTAL_MIGRATOR_PASSWORD:migrator_local_only}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # 트랜잭션 밖 DB 접근 금지(불변 규약 2) — DB 헬스 지표는 테넌트 없이 커넥션을 쓰므로 끈다.
    # 포털 Phase 8에서 전용 롤(portal_health)로 복원한다(설계서 §9 롤 표).
    db:
      enabled: false

# 인제스트(포털 Phase 1 — 설계서 §6.1). 폴링은 enabled=true일 때만(배포 구성이 켠다). 테넌트 목록은 전용 롤 portal_directory(V3),
# 서비스 토큰은 token-dir/<TENANT_ID> 파일(값은 저장소·로그에 0 — 계획 승인 Q7).
portal:
  ingest:
    enabled: ${PORTAL_INGEST_ENABLED:false}
    limit: 200
    default-poll-interval: 10s
    http-timeout: 10s
    tick: 1s
    token-dir: ${PORTAL_ENGINE_TOKEN_DIR:/run/secrets/portal-engine-tokens}
    directory-username: ${PORTAL_DIRECTORY_USER:portal_directory}
    directory-password: ${PORTAL_DIRECTORY_PASSWORD:directory_local_only}
    # 재구축(설계서 §6.7) 상한 — 한 트랜잭션 재생의 길이를 묶는다(긴 트랜잭션 비용은 §14.1)
    rebuild-max-events: 50000
  # 조회 API(포털 Phase 3 — 설계서 §9 v1.6). 토큰의 iss → 테넌트는 전용 롤 portal_issuer(V5: tenant의 세 열만)로 요청마다 조회한다.
  # 기본 자격 증명은 로컬 개발 전용(docker/postgres/init-roles.sql과 짝) — 운영은 환경으로 준다.
  api:
    issuer-username: ${PORTAL_ISSUER_USER:portal_issuer}
    issuer-password: ${PORTAL_ISSUER_PASSWORD:issuer_local_only}
    issuer-pool-size: 4
    jwks-timeout: 5s
  # 조회 유스케이스(포털 Phase 3): policyKey HMAC 비밀 파일(배포 비밀 — 값은 저장소·로그에 0, 기본 경로에 없으면 웹 애플리케이션이 뜨지 않는다),
  # tenant.params.sync_delay_seconds가 없을 때의 기본 지연 초(설계서 §5 — 코드 상수가 아니다).
  query:
    policy-key-secret-file: ${PORTAL_POLICY_KEY_SECRET_FILE:/run/secrets/portal-policy-key}
    default-sync-delay-seconds: 300
  # 시뮬레이션(포털 Phase 5 — 설계서 §4.3·§10): 엔진 연결·읽기 시간 초과(재시도 0), 테넌트 params.sim_rate_per_minute이 없을 때의 설계사당 분당 한도.
  # 토큰은 인제스트와 같은 파일(portal.ingest.token-dir/<TENANT_ID>).
  sim:
    connect-timeout: ${PORTAL_SIM_CONNECT_TIMEOUT:2s}
    read-timeout: ${PORTAL_SIM_READ_TIMEOUT:10s}
    default-rate-per-minute: 10
  # 대사(포털 Phase 7 — 설계서 §6.6): 앱 안 스케줄러(1분 틱, 테넌트 recon_hour_kst의 KST 하루 한 번), 엔진 명세 조회 시간 초과(재시도 0).
  # defaults는 tenant.params에 키가 없을 때의 값(코드 상수가 아니다). 스케줄러는 통합 시험·E2E·CLI에서 끈다.
  recon:
    scheduler-enabled: ${PORTAL_RECON_SCHEDULER_ENABLED:true}
    tick: 1m
    connect-timeout: ${PORTAL_RECON_CONNECT_TIMEOUT:2s}
    read-timeout: ${PORTAL_RECON_READ_TIMEOUT:10s}
    defaults:
      recon-hour-kst: 4
      auto-rebuild-enabled: true
      caught-up-within-seconds: 900
      call-interval-ms: 200
      max-calls: 500
      max-seconds: 900
