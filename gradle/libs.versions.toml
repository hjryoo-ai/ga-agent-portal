# 버전 정책 (CLAUDE.md 코드 규약)
# - Spring Boot BOM이 관리하는 라이브러리(Flyway·JUnit·Testcontainers·AssertJ·Jackson·PostgreSQL 드라이버 등)는
#   여기에 버전을 적지 않고 BOM(spring-boot-dependencies)에 위임한다.
# - BOM 밖의 라이브러리만 버전을 고정한다. 확인 출처와 일자는 주석과 docs/phase-00-보고서.md.
# - 모든 의존성(플러그인·BOM 포함)의 SHA-256은 gradle/verification-metadata.xml에 고정한다(계획 승인 Q8). 버전을 올리면 메타데이터를 다시 만든다.
# - net.jqwik은 어떤 경로로도 해석되면 빌드가 실패한다(루트 build.gradle.kts, CLAUDE.md 절대 규칙 7).
# - SNAPSHOT 금지(verifyNoSnapshots).

[versions]
java = "25"
spring-boot = "4.1.1"            # 4.1.x 최신(2026-08-20 발행, 2026-10-16 Maven Central 확인)
archunit = "1.5.1"               # 2026-10-16 Maven Central 최신
ga-platform = "0.2.0"            # ga-disclosure 태그 platform-v0.2.0(db82d5d), 발행 run 38552151950. 0.1.0은 쓰지 않는다(H1)
postgres-image = "postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"  # 18.6(18.x 최신), 다중 아키텍처 인덱스 digest — 2026-10-16 실측

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# 플랫폼 — 발행본 0.2.0
platform-core = { module = "com.ga.platform:platform-core", version.ref = "ga-platform" }
platform-canonical = { module = "com.ga.platform:platform-canonical", version.ref = "ga-platform" }
platform-spring = { module = "com.ga.platform:platform-spring", version.ref = "ga-platform" }

# BOM 밖 — 버전 고정
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

# BOM 관리 — 버전 없음
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
spring-context = { module = "org.springframework:spring-context" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
